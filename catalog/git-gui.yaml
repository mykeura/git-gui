name: git-gui
title: Git Gui
repo: https://github.com/mykeura/git-gui
sha: TODO-40-hex-sha-pinned-at-submit-time
description: >-
  Read-only commit graph for Hermes Desktop, inspired by modern graphical Git
  clients. A compact graph pane
  lives in the right sidebar; a full three-column page (BRANCH / TAG | GRAPH |
  COMMIT MESSAGE) shows every branch in its own color, and clicking a commit
  opens a drawer with the message, parents, changed files and per-file diffs.
  Backed by a small read-only Python plugin API — local git only, no network.
  Disclosure — none: it only runs read-only git commands on the session's
  working directory.
maintainer: mykeura
tier: community
category: desktop
docs_url: https://github.com/mykeura/git-gui#readme
